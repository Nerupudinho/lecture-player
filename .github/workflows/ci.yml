name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      # Debug-signed so it installs on any phone for review. Release/Play
      # builds stay manual with the upload key (see store/PLAY_CHECKLIST.md).
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: lecture-player-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
